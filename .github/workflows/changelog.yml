name: Atualizar Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite execução manual pela aba Actions

permissions:
  contents: write

jobs:
  build-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essencial para carregar todo o histórico de tags e commits

      - name: Gerar bloco de alterações
        run: |
          DATE=$(date +'%d/%m/%Y')
          TEMP_LOG="TEMP_CHANGELOG.md"

          echo "# Changelog" > $TEMP_LOG
          echo "" >> $TEMP_LOG
          echo "## [$DATE] - Atualização" >> $TEMP_LOG
          echo "" >> $TEMP_LOG

          # Extrai os últimos 15 commits ignorando commits automáticos de merge e do próprio bot
          git log -n 15 --no-merges --invert-grep --grep="docs(changelog)" \
            --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> $TEMP_LOG
          
          echo -e "\n" >> $TEMP_LOG

          # Preserva o histórico anterior se o arquivo já existir
          if [ -f CHANGELOG.md ]; then
            # Pula o título principal anterior (# Changelog)
            tail -n +3 CHANGELOG.md >> $TEMP_LOG
          fi

          mv $TEMP_LOG CHANGELOG.md

      - name: Commit e Push das alterações
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(changelog): atualiza histórico de alterações [skip ci]"
          file_pattern: "CHANGELOG.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
